<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc">
  <title id="title">Product search screen split into example components</title>
  <desc id="desc">ProductApp contains SearchBar and ProductTable. ProductTable contains three repeated ProductRow components.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #263e30; }
    .label { font-size: 18px; font-weight: 700; }
    .ui { font-size: 16px; }
    .muted { fill: #63746a; }
  </style>
  <rect x="2" y="2" width="556" height="426" rx="10" fill="#f6faf7" stroke="#39734e" stroke-width="3"/>
  <text x="22" y="30" class="label">ProductApp</text>
  <rect x="20" y="46" width="520" height="112" rx="8" fill="#fff7e8" stroke="#b98735" stroke-width="2"/>
  <text x="36" y="72" class="label">SearchBar</text>
  <rect x="36" y="84" width="488" height="29" rx="4" fill="white" stroke="#c7cfc9"/>
  <text x="48" y="105" class="ui muted">Search products…</text>
  <rect x="37" y="126" width="15" height="15" rx="2" fill="white" stroke="#788a7c"/>
  <text x="62" y="139" class="ui">In stock only</text>
  <rect x="20" y="176" width="520" height="234" rx="8" fill="#eef4fb" stroke="#6687b0" stroke-width="2"/>
  <text x="36" y="204" class="label">ProductTable</text>
  <text x="54" y="234" class="ui muted">Product</text>
  <text x="436" y="234" class="ui muted">Price</text>
  <rect x="36" y="245" width="488" height="47" rx="5" fill="#fff" stroke="#9a7bb0" stroke-width="2"/>
  <text x="50" y="274" class="label" style="font-size:15px;fill:#77548c">ProductRow</text>
  <text x="198" y="274" class="ui">Apple</text><text x="450" y="274" class="ui">$1</text>
  <rect x="36" y="299" width="488" height="47" rx="5" fill="#fff" stroke="#9a7bb0" stroke-width="2"/>
  <text x="50" y="328" class="label" style="font-size:15px;fill:#77548c">ProductRow</text>
  <text x="198" y="328" class="ui">Dragonfruit</text><text x="450" y="328" class="ui">$1</text>
  <rect x="36" y="353" width="488" height="47" rx="5" fill="#fff" stroke="#9a7bb0" stroke-width="2"/>
  <text x="50" y="382" class="label" style="font-size:15px;fill:#77548c">ProductRow</text>
  <text x="198" y="382" class="ui">Passionfruit</text><text x="450" y="382" class="ui">$2</text>
</svg>
