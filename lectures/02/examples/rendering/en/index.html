<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rendering Experiments</title>
    <meta
      name="description"
      content="A personal site built with HTML, CSS and JavaScript"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./rendering.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Rendering Experiments</h1>
      <section class="profile">
        <h1>About Me</h1>
        <p id="intro" aria-live="polite">Building my first website.</p>
        <button id="change" type="button">Change Introduction</button>
      </section>
      <div class="tools">
        <button id="width" type="button">Change Width</button>
        <button id="color" type="button">Change Background</button>
        <button id="hide" type="button">Hide Paragraph</button>
        <button id="reset" type="button">Reset</button>
      </div>
      <p class="note">
        width: 360px → 220px · background-color: #f0f3ef → #dceaf5
      </p>
    </main>
  </body>
</html>
