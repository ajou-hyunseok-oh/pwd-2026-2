<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Week 2 · Source Code</title>
    <style>
      body {
        max-width: 1050px;
        margin: 40px auto;
        padding: 0 24px;
        color: #263a2c;
        font:
          16px/1.7 Arial,
          sans-serif;
      }
      h1 {
        line-height: 1.3;
      }
      a {
        color: #1f6b4a;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td,
      th {
        padding: 16px;
        text-align: left;
        border-bottom: 1px solid #d5dfd7;
      }
      code,
      pre {
        font-family: Consolas, monospace;
      }
      pre {
        padding: 20px;
        background: #f0f3ef;
        overflow: auto;
        font-size: 15px;
        line-height: 1.6;
      }
      select {
        padding: 8px;
        max-width: 100%;
        font-size: 16px;
      }
      .note {
        padding: 16px;
        background: #f0f3ef;
      }
      .links {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      @media (max-width: 600px) {
        td,
        th {
          padding: 8px;
        }
        body {
          margin: 24px auto;
          padding: 0 12px;
        }
      }
    </style>
  </head>
  <body>
    <h1>예제 소스 / Example Source</h1>
    <p><a href="./index.html">예제 목록 / Catalog</a></p>
    <label for="file">파일 / File</label>
    <select id="file"></select>
    <pre><code id="source"></code></pre>
    <script src="./source-data.js"></script>
    <script src="./catalog.js"></script>
  </body>
</html>
